<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="rezki ::= engineer | educator — Rezki Boureghdad, back-end and data architect, computer-science educator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140B2B"/>
      <stop offset="1" stop-color="#21103F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E879F9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset=".55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A78BFA" fill-opacity=".12"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="980" cy="70" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="330" r="220" fill="url(#glow2)">
      <animate attributeName="cx" values="160;260;160" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#A78BFA" stroke-opacity=".25"/>

  <!-- the grammar rule: each word placed and sized explicitly so the underline lines up in any monospace font -->
  <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="30">
    <text x="64" y="92" fill="#8E84A8" textLength="180" lengthAdjust="spacingAndGlyphs">rezki ::=</text>
    <text x="262" y="92" textLength="144" lengthAdjust="spacingAndGlyphs" fill="#C4B5FD">engineer
      <animate attributeName="fill" values="#C4B5FD;#C4B5FD;#6F6688;#6F6688;#C4B5FD" keyTimes="0;.45;.5;.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="428" y="92" fill="#8E84A8">|</text>
    <text x="462" y="92" textLength="144" lengthAdjust="spacingAndGlyphs" fill="#6F6688">educator
      <animate attributeName="fill" values="#6F6688;#6F6688;#F0ABFC;#F0ABFC;#6F6688" keyTimes="0;.45;.5;.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="262" y="102" width="144" height="4" rx="2" fill="#A78BFA">
      <animate attributeName="x" values="262;262;462;462;262" keyTimes="0;.45;.5;.95;1" dur="6s" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.2 .8 .2 1" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#A78BFA;#A78BFA;#F0ABFC;#F0ABFC;#A78BFA" keyTimes="0;.45;.5;.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="624" y="70" width="14" height="28" fill="#A78BFA">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="60" y="210" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#name)">Rezki Boureghdad</text>

  <text x="64" y="262" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="24" fill="#CFC7E6">Back-end &amp; data engineer at Solrus  ·  Computer-science educator at UMBB</text>
  <text x="64" y="300" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="17" fill="#8E84A8">// Algiers, Algeria  ·  FastAPI · PostgreSQL · Kafka · MCP · Flutter</text>
</svg>
